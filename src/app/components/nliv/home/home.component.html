<div class="w-screen h-screen overflow-hidden flex items-center justify-center flex-col">
    <div class="w-full flex items-center justify-center p-2">
        <div></div>
        <div class="flex-grow"></div>
        <div>
            <app-user-actions></app-user-actions>
        </div>
    </div>
    <div class="flex-grow"></div>
    <div class="flex flex-col items-center justify-center gap-7 w-full">
        <div
            [ngClass]="{'h-full flex items-center justify-center font-black text-[50px]': true, 'hidden': hasSuggestions}">
            Brwein
        </div>
        <form [ngClass]="{
            'relative border-1 border-solid flex items-center justify-center min-w-[60%] max-w-full': true,
            'rounded-t-xl border-slate-200': hasSuggestions,
            'rounded-full border-slate-800': !hasSuggestions
          }">
            <input #searchInput (input)="hasSuggestions = (searchInput.value ? true : false)"
                placeholder="Search anything" class="rounded-s-full w-full h-full flex-grow py-2 px-4 outline-none" />
            <span class="p-2 h-full flex items-center justify-center" role="button"><span
                    class="material-symbols-outlined">search</span></span>

            <div *ngIf="hasSuggestions"
                class="absolute left-0 right-0 top-[100%] p-3 shadow-md rounded-b-xl h-[40vh] bg-white border-slate-200 border-1 w-full overflow-y-auto">
                mhm
            </div>
        </form>
        <div [ngClass]="{'h-full flex items-center justify-center': true, 'mt-[-100px]': hasSuggestions}">
            <a href="/chat"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">chat</a>
            <a href="/marketplace"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">shopping_cart</a>
            <a href="/courses"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">auto_stories</a>
            <a href="/groups"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">group</a>
            <a href="/games"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">stadia_controller</a>
            <a href="/videos"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">tv</a>
            <a href="/map"
                class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined"
                role="button">map</a>
        </div>
    </div>
    <div class="flex-grow"></div>
    <div class="w-full h-[200px] bg-slate-200">
        <div class="flex items-center justify-center h-full">
            <div class="flex items-center justify-center gap-2">
                <a href="/about" class="text-decoration-none text-slate-950 hover:text-orange-500">About</a>
                <a href="/terms" class="text-decoration-none text-slate-950 hover:text-orange-500">Terms</a>
                <a href="/privacy" class="text-decoration-none text-slate-950 hover:text-orange-500">Privacy</a>
                <a href="/help" class="text-decoration-none text-slate-950 hover:text-orange-500">Help</a>
            </div>
        </div>
    </div>
</div>
