<div class="search-result flex p-5">
    <div class="flex gap-2 flex-grow">
        <div class="w-full flex-grow flex flex-col">
            <div class="flex gap-2 justify-start items-center w-full">
                <div *ngIf="searchResult.image">
                    <img [src]="searchResult.image" class="w-[50px] h-[50px] rounded-full"
                        alt="{{ searchResult.title }}">
                </div>
                <div class="flex flex-col w-full flex-grow">
                    <span class="font-bold"><a [href]="searchResult.url">{{ searchResult.title }}</a></span>
                    <span class="flex items-start justify-start w-full">
                        <a class="url flex-grow" target="_BLANK" [href]="searchResult.url">{{ searchResult.url }}</a>
                        <span class="text-slate-500 material-symbols-outlined cursor-pointer">more_vert</span>
                    </span>
                </div>
            </div>
            <div class="flex flex-col items-start justify-start">
                <p class="description">{{ searchResult.description.slice(0, 100) }}<span class="text-slate-500">...</span></p>
                <div class="flex w-full">
                    <div *ngIf="searchResult.tags.length > 0" class="flex-grow">
                        <span class="tag" *ngFor="let tag of searchResult.tags"><a [href]="'/s/a?t=' + tag">{{ tag
                                }},&nbsp;</a></span>
                    </div>
                    <p class="date">{{ searchResult.date }}</p>
                </div>
            </div>
        </div>
        <div *ngIf="searchResult.image">
            <img [src]="searchResult.image" class="w-[100px] h-[100px] rounded-md" alt="{{ searchResult.title }}">
        </div>



    </div>
    <div class="flex-grow"></div>
</div>
