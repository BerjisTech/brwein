<div class="w-screen h-screen  overflow-x-hidden overflow-y-hidden flex text-white">
    <div class="h-screen bg-slate-950 w-[350px] p-4 flex flex-col gap-3">
        <div class="flex-grow w-full h-[90vh] overflow-y-auto">
            <app-history></app-history>
        </div>

        <app-settings></app-settings>
    </div>
    <div class="h-screen bg-slate-800 flex-grow p-4 flex flex-col gap-3">
        <div class="w-full">Top</div>
        <div class="w-full flex-grow">
            <app-results *ngFor="let chat of aiChats?.aiChat" [prompt]="chat.prompt"></app-results>
        </div>
        <div class="w-full flex items-center justify-center">
            <app-chat-bar (promptSubmit)="addAiChat($event)"></app-chat-bar>
        </div>
    </div>
</div>
