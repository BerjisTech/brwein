<form class="min-w-[50vw] border-1 border-slate-50 rounded-xl p-3 flex" (submit)="loadResults($event, aiPrompt.value);aiPrompt.value=''">
    <label class="material-icons text-white cursor-pointer">
        attach_file
        <input type="file" class="hidden" />
    </label>
    <input #aiPrompt type="text" class="flex-grow bg-transparent text-white outline-none" placeholder="Type a message">
    <button type="submit" class="material-icons text-white">send</button>
</form>
