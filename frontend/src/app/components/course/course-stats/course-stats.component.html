<div class="chart-container">
    <ngx-charts-line-chart [scheme]="colorScheme" [showXAxisLabel]="showXAxisLabel" [showYAxisLabel]="showYAxisLabel"
        [xAxis]="xAxis" [yAxis]="yAxis" [xAxisLabel]="x_axis_label" [yAxisLabel]="y_axis_label" [timeline]="timeline"
        [results]="multi" (select)="onSelect($event)" (activate)="onActivate($event)"
        (deactivate)="onDeactivate($event)">
    </ngx-charts-line-chart>
</div>
