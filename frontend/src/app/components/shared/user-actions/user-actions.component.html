<div class="flex items-center justify-center rounded-md p-1 text-slate-50 relative"
    role="button" (click)="showActions = !showActions">
    <div class="w-[45px] h-[45px] p-[2px] rounded-full border-[2px] border-solid border-orange-500">
        <img src="/assets/images/avatar.jpg" alt="" class="w-full h-full object-cover object-center rounded-full" />
    </div>
    <span
        class="text-decoration-none text-slate-950 hover:text-orange-500 p-2 h-full flex items-center justify-center material-symbols-outlined">expand_more</span>
</div>
<div *ngIf="showActions"
    class="absolute top-[70px] right-2 p-5 rounded-md bg-slate-50 shadow-md border border-solid min-w-[300px]">

</div>
